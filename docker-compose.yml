name: caseflow

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: caseflow-backend:latest
    container_name: caseflow-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/caseflow.db
      - SECRET_KEY=caseflow-super-secret-key-for-jwt-signing-2026
      - ENCRYPTION_KEY=b3JnYW5pemF0aW9uYWwta2V5LTMyLWJ5dGVzLXNlY3JldA==
      - PYTHONUNBUFFERED=1
    volumes:
      - caseflow-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - caseflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: caseflow-frontend:latest
    container_name: caseflow-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - caseflow-network

volumes:
  caseflow-data:
    driver: local

networks:
  caseflow-network:
    driver: bridge
