name: caseflow-dev

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: caseflow-backend-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - caseflow-dev-data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/caseflow.db
      - SECRET_KEY=caseflow-super-secret-key-for-jwt-signing-2026
      - ENCRYPTION_KEY=b3JnYW5pemF0aW9uYWwta2V5LTMyLWJ5dGVzLXNlY3JldA==
      - PYTHONUNBUFFERED=1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - caseflow-dev-network

  frontend:
    image: node:20-alpine
    container_name: caseflow-frontend-dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend
    networks:
      - caseflow-dev-network

volumes:
  caseflow-dev-data:
    driver: local

networks:
  caseflow-dev-network:
    driver: bridge
